name: Test major bump via DEFAULT_BUMP
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - id: action
        uses: .
        env:
          DEFAULT_BUMP: major
          DRY_RUN: "true"
          FORCE_WITHOUT_CHANGES: "true"
          INITIAL_VERSION: "0.0.0"
          WITH_V: "false"
          RELEASE_BRANCHES: master,main
          GIT_API_TAGGING: "false"
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Assert part contains major
        env:
          PART: ${{ steps.action.outputs.part }}
        run: |
          echo "part: $PART"
          if [ -z "$PART" ]; then
            echo "FAIL: part output is empty"
            exit 1
          fi
          if [[ "$PART" != *major* ]]; then
            echo "FAIL: expected part to contain 'major' but got '$PART'"
            exit 1
          fi
          echo "PASS: part=$PART"

      - name: Assert new_tag is set and non-empty
        env:
          NEW_TAG: ${{ steps.action.outputs.new_tag }}
        run: |
          echo "new_tag: $NEW_TAG"
          if [ -z "$NEW_TAG" ]; then
            echo "FAIL: new_tag output is empty"
            exit 1
          fi
          echo "PASS: new_tag=$NEW_TAG"
