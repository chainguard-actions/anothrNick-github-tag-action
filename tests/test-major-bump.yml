name: Test major bump via commit message token
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
      GITHUB_REPOSITORY: test-owner/test-repo
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      # Create a commit with #major in the message so the action bumps major
      - name: Create commit with major bump token
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          echo "trigger-major-bump" >> /tmp/trigger.txt
          git add -A || true
          # Use an empty commit with #major in the message
          git commit --allow-empty -m "feat: breaking change #major"

      - id: action
        uses: .
        env:
          DEFAULT_BUMP: minor
          DRY_RUN: "true"
          RELEASE_BRANCHES: main,act-harness
          INITIAL_VERSION: "1.0.0"
          WITH_V: "false"
          BRANCH_HISTORY: last
          VERBOSE: "true"
          GITHUB_TOKEN: dummy-token

      - name: Assert part is major
        env:
          PART: ${{ steps.action.outputs.part }}
        run: |
          echo "part: $PART"
          if [ "$PART" != "major" ]; then
            echo "FAIL: expected part=major, got: $PART"
            exit 1
          fi
          echo "PASS: part=major"

      - name: Assert new_tag starts with 2
        env:
          NEW_TAG: ${{ steps.action.outputs.new_tag }}
        run: |
          echo "new_tag: $NEW_TAG"
          if [ -z "$NEW_TAG" ]; then
            echo "FAIL: new_tag is empty"
            exit 1
          fi
          # Major version should be bumped from 1.x.x to 2.0.0
          if [[ "$NEW_TAG" != 2.* ]]; then
            echo "FAIL: expected new_tag to start with '2.', got: $NEW_TAG"
            exit 1
          fi
          echo "PASS: new_tag=$NEW_TAG"
