name: Test major bump via commit message token
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Configure git user and create a commit with #major token
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          # Create a new commit whose message contains #major
          echo "trigger" >> /tmp/trigger.txt
          cp /tmp/trigger.txt trigger-major.txt
          git add trigger-major.txt
          git commit -m "feat: breaking change #major"

      - id: action
        uses: .
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DEFAULT_BUMP: minor
          DRY_RUN: "true"
          RELEASE_BRANCHES: main,master
          INITIAL_VERSION: "0.0.0"
          BRANCH_HISTORY: last

      - name: Assert part is major
        env:
          PART: ${{ steps.action.outputs.part }}
        run: |
          echo "part: $PART"
          if [ "$PART" != "major" ]; then
            echo "FAIL: expected part='major', got '$PART'"
            exit 1
          fi
          echo "PASS: part=major"

      - name: Assert new_tag is set
        env:
          NEW_TAG: ${{ steps.action.outputs.new_tag }}
        run: |
          echo "new_tag: $NEW_TAG"
          if [ -z "$NEW_TAG" ]; then
            echo "FAIL: new_tag output is empty"
            exit 1
          fi
          echo "PASS: new_tag=$NEW_TAG"
