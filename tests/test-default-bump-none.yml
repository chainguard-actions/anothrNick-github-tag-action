name: Test default bump none skips tagging
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - id: action
        uses: .
        env:
          DEFAULT_BUMP: none
          DRY_RUN: "true"
          FORCE_WITHOUT_CHANGES: "true"
          INITIAL_VERSION: "0.0.0"
          WITH_V: "false"
          RELEASE_BRANCHES: master,main
          GIT_API_TAGGING: "false"
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Assert part is none
        env:
          PART: ${{ steps.action.outputs.part }}
        run: |
          echo "part: $PART"
          if [ "$PART" != "none" ]; then
            echo "FAIL: expected part='none' but got '$PART'"
            exit 1
          fi
          echo "PASS: part=none as expected"

      - name: Assert tag is set (current tag returned)
        env:
          TAG: ${{ steps.action.outputs.tag }}
        run: |
          echo "tag: $TAG"
          if [ -z "$TAG" ]; then
            echo "FAIL: tag output is empty"
            exit 1
          fi
          echo "PASS: tag=$TAG"
