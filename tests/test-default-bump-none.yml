name: Test default bump none (skip tagging)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up git origin reachable inside the Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - id: action
        uses: .
        env:
          DEFAULT_BUMP: none
          DRY_RUN: "true"
          INITIAL_VERSION: "1.0.0"
          RELEASE_BRANCHES: act-harness,master,main
          BRANCH_HISTORY: last
          GITHUB_TOKEN: ${{ github.token }}

      - name: Assert action outputs are set when bump is none
        env:
          NEW_TAG: ${{ steps.action.outputs.new_tag }}
          TAG: ${{ steps.action.outputs.tag }}
          PART: ${{ steps.action.outputs.part }}
        run: |
          echo "new_tag: $NEW_TAG"
          echo "tag: $TAG"
          echo "part: $PART"
          # When DEFAULT_BUMP=none and no bump token in commit, action skips and outputs current tag
          # The outputs should be set (either to the current tag or empty if skipped early)
          if [ -z "$NEW_TAG" ] && [ -z "$TAG" ]; then
            echo "FAIL: both new_tag and tag are empty"
            exit 1
          fi
          echo "PASS: action completed with none bump"

      - name: Assert part is none when default bump is none
        env:
          PART: ${{ steps.action.outputs.part }}
        run: |
          echo "part: $PART"
          if [ "$PART" != "none" ]; then
            echo "FAIL: expected part=none, got '$PART'"
            exit 1
          fi
          echo "PASS: part=none"
