name: Test prerelease tag
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up git origin reachable inside the Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - id: action
        uses: .
        env:
          DEFAULT_BUMP: minor
          PRERELEASE: "true"
          PRERELEASE_SUFFIX: beta
          DRY_RUN: "true"
          INITIAL_VERSION: "0.0.0"
          # act-harness is NOT in RELEASE_BRANCHES so prerelease stays true
          RELEASE_BRANCHES: master,main
          BRANCH_HISTORY: last
          GITHUB_TOKEN: ${{ github.token }}

      - name: Assert new_tag contains prerelease suffix
        env:
          NEW_TAG: ${{ steps.action.outputs.new_tag }}
          PART: ${{ steps.action.outputs.part }}
        run: |
          echo "new_tag: $NEW_TAG"
          echo "part: $PART"
          if [ -z "$NEW_TAG" ]; then
            echo "FAIL: new_tag output is empty"
            exit 1
          fi
          if ! echo "$NEW_TAG" | grep -q "beta"; then
            echo "FAIL: expected new_tag '$NEW_TAG' to contain 'beta' prerelease suffix"
            exit 1
          fi
          echo "PASS: new_tag contains prerelease suffix 'beta'"

      - name: Assert part contains pre- prefix
        env:
          PART: ${{ steps.action.outputs.part }}
        run: |
          echo "part: $PART"
          if ! echo "$PART" | grep -q "pre-"; then
            echo "FAIL: expected part '$PART' to contain 'pre-' prefix for prerelease"
            exit 1
          fi
          echo "PASS: part contains pre- prefix"
