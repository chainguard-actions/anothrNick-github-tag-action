name: Test prerelease tag on non-release branch
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/feature-branch
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      # Simulate being on a feature branch (not in RELEASE_BRANCHES)
      - name: Create and switch to feature branch
        run: |
          git checkout -b feature-branch || git checkout feature-branch

      - id: action
        uses: .
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DEFAULT_BUMP: minor
          PRERELEASE: "true"
          PRERELEASE_SUFFIX: beta
          RELEASE_BRANCHES: main,master
          DRY_RUN: "true"
          INITIAL_VERSION: "0.0.0"
          VERBOSE: "true"

      - name: Assert new_tag contains beta suffix
        env:
          NEW_TAG: ${{ steps.action.outputs.new_tag }}
        run: |
          echo "new_tag: $NEW_TAG"
          if [ -z "$NEW_TAG" ]; then
            echo "FAIL: new_tag output is empty"
            exit 1
          fi
          if ! echo "$NEW_TAG" | grep -q "beta"; then
            echo "FAIL: expected new_tag to contain 'beta', got '$NEW_TAG'"
            exit 1
          fi
          echo "PASS: new_tag=$NEW_TAG contains beta"

      - name: Assert part contains pre-
        env:
          PART: ${{ steps.action.outputs.part }}
        run: |
          echo "part: $PART"
          if [ -z "$PART" ]; then
            echo "FAIL: part output is empty"
            exit 1
          fi
          if ! echo "$PART" | grep -q "pre-"; then
            echo "FAIL: expected part to contain 'pre-', got '$PART'"
            exit 1
          fi
          echo "PASS: part=$PART contains pre-"
