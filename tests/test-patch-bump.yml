name: Test patch bump via commit message token
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Configure git user and make a patch commit
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          # Create a dummy commit with #patch token so the action detects it
          echo "patch-test-$(date +%s)" > /tmp/patch-test-file.txt
          cp /tmp/patch-test-file.txt patch-test-file.txt
          git add patch-test-file.txt
          git commit -m "fix: small fix #patch"

      - id: action
        uses: .
        env:
          DEFAULT_BUMP: minor
          DRY_RUN: "true"
          RELEASE_BRANCHES: main,master
          INITIAL_VERSION: "0.0.0"
          WITH_V: "false"
          BRANCH_HISTORY: last
          GIT_API_TAGGING: "false"

      - name: Assert part is patch
        env:
          PART: ${{ steps.action.outputs.part }}
        run: |
          echo "part: $PART"
          if [ "$PART" != "patch" ]; then
            echo "FAIL: expected part='patch', got '$PART'"
            exit 1
          fi
          echo "PASS"

      - name: Assert new_tag is set
        env:
          NEW_TAG: ${{ steps.action.outputs.new_tag }}
        run: |
          echo "new_tag: $NEW_TAG"
          if [ -z "$NEW_TAG" ]; then
            echo "FAIL: new_tag should not be empty"
            exit 1
          fi
          echo "PASS: new_tag=$NEW_TAG"
