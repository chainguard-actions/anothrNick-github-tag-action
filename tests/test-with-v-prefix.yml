name: Test with_v prefix produces v-prefixed tag
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - id: action
        uses: .
        env:
          DEFAULT_BUMP: patch
          DRY_RUN: "true"
          FORCE_WITHOUT_CHANGES: "true"
          INITIAL_VERSION: "1.0.0"
          WITH_V: "true"
          RELEASE_BRANCHES: master,main
          GIT_API_TAGGING: "false"
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Assert new_tag starts with v
        env:
          NEW_TAG: ${{ steps.action.outputs.new_tag }}
        run: |
          echo "new_tag: $NEW_TAG"
          if [ -z "$NEW_TAG" ]; then
            echo "FAIL: new_tag is empty"
            exit 1
          fi
          # Since act-harness is not in release_branches, it will be a pre-release
          # The tag should still start with 'v'
          if [[ "$NEW_TAG" != v* ]]; then
            echo "FAIL: expected new_tag to start with 'v' but got '$NEW_TAG'"
            exit 1
          fi
          echo "PASS: new_tag=$NEW_TAG starts with v"

      - name: Assert part is set to patch or pre-patch
        env:
          PART: ${{ steps.action.outputs.part }}
        run: |
          echo "part: $PART"
          if [ -z "$PART" ]; then
            echo "FAIL: part output is empty"
            exit 1
          fi
          if [[ "$PART" != *patch* ]]; then
            echo "FAIL: expected part to contain 'patch' but got '$PART'"
            exit 1
          fi
          echo "PASS: part=$PART"
