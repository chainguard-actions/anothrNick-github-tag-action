name: Test with v prefix
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up git origin reachable inside the Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - id: action
        uses: .
        env:
          DEFAULT_BUMP: patch
          WITH_V: "true"
          DRY_RUN: "true"
          INITIAL_VERSION: "0.0.0"
          RELEASE_BRANCHES: act-harness,master,main
          BRANCH_HISTORY: last
          GITHUB_TOKEN: ${{ github.token }}

      - name: Assert new_tag starts with v
        env:
          NEW_TAG: ${{ steps.action.outputs.new_tag }}
          PART: ${{ steps.action.outputs.part }}
        run: |
          echo "new_tag: $NEW_TAG"
          echo "part: $PART"
          if [ -z "$NEW_TAG" ]; then
            echo "FAIL: new_tag output is empty"
            exit 1
          fi
          if ! echo "$NEW_TAG" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "FAIL: new_tag '$NEW_TAG' does not start with 'v' or is not valid semver"
            exit 1
          fi
          echo "PASS: new_tag starts with v and is valid semver"

      - name: Assert part is patch
        env:
          PART: ${{ steps.action.outputs.part }}
        run: |
          echo "part: $PART"
          if [ "$PART" != "patch" ]; then
            echo "FAIL: expected part=patch, got '$PART'"
            exit 1
          fi
          echo "PASS: part=patch"
