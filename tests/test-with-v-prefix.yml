name: Test with-v prefix
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up git identity and origin reachable inside Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git push "$GITHUB_WORKSPACE/.git-remote" --tags
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - id: action
        uses: .
        env:
          DEFAULT_BUMP: patch
          WITH_V: "true"
          DRY_RUN: "true"
          INITIAL_VERSION: "1.0.0"
          RELEASE_BRANCHES: act-harness,master,main
          GIT_API_TAGGING: "false"
          GITHUB_TOKEN: ${{ github.token }}

      - name: Assert new_tag has v prefix and looks like semver
        env:
          NEW_TAG: ${{ steps.action.outputs.new_tag }}
          PART: ${{ steps.action.outputs.part }}
        run: |
          echo "new_tag: $NEW_TAG"
          echo "part: $PART"
          if [ -z "$NEW_TAG" ]; then
            echo "FAIL: new_tag output is empty"
            exit 1
          fi
          # Should start with 'v' and look like vX.Y.Z
          if ! echo "$NEW_TAG" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "FAIL: new_tag '$NEW_TAG' does not match vX.Y.Z pattern"
            exit 1
          fi
          if [ "$PART" != "patch" ]; then
            echo "FAIL: expected part='patch' but got '$PART'"
            exit 1
          fi
          echo "PASS: new_tag=$NEW_TAG with v prefix, part=$PART"
