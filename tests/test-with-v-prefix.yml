name: Test with-v prefix dry-run
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
      GITHUB_REPOSITORY: test-owner/test-repo
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - id: action
        uses: .
        env:
          DEFAULT_BUMP: patch
          DRY_RUN: "true"
          RELEASE_BRANCHES: main
          INITIAL_VERSION: "1.2.3"
          WITH_V: "true"
          VERBOSE: "true"
          GITHUB_TOKEN: dummy-token

      - name: Assert new_tag starts with v
        env:
          NEW_TAG: ${{ steps.action.outputs.new_tag }}
        run: |
          echo "new_tag: $NEW_TAG"
          if [ -z "$NEW_TAG" ]; then
            echo "FAIL: new_tag output is empty"
            exit 1
          fi
          if [[ "$NEW_TAG" != v* ]]; then
            echo "FAIL: expected new_tag to start with 'v', got: $NEW_TAG"
            exit 1
          fi
          echo "PASS: new_tag=$NEW_TAG starts with v"

      - name: Assert part is patch
        env:
          PART: ${{ steps.action.outputs.part }}
        run: |
          echo "part: $PART"
          if [ "$PART" != "patch" ]; then
            echo "FAIL: expected part=patch, got: $PART"
            exit 1
          fi
          echo "PASS: part=patch"
