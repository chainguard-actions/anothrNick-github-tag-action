name: Test patch bump via commit message
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Create a commit with #patch token
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          # Create a dummy file and commit with #patch in the message
          echo "patch-test-$(date +%s)" > /tmp/patch-test-file.txt
          cp /tmp/patch-test-file.txt "$GITHUB_WORKSPACE/patch-test-file.txt"
          git add "$GITHUB_WORKSPACE/patch-test-file.txt"
          git commit -m "fix: small fix #patch"

      - name: Set up git origin reachable inside the Docker container
        run: |
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git push "$GITHUB_WORKSPACE/.git-remote" --tags
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - id: action
        uses: .
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BUMP: minor
          WITH_V: "false"
          DRY_RUN: "true"
          INITIAL_VERSION: "1.0.0"
          RELEASE_BRANCHES: act-harness
          BRANCH_HISTORY: last
          VERBOSE: "true"

      - name: Assert part is patch
        env:
          PART: ${{ steps.action.outputs.part }}
        run: |
          echo "part: $PART"
          if [ "$PART" != "patch" ]; then
            echo "FAIL: expected part='patch', got '$PART'"
            exit 1
          fi
          echo "PASS"

      - name: Assert new_tag is a valid semver without v prefix
        env:
          NEW_TAG: ${{ steps.action.outputs.new_tag }}
        run: |
          echo "new_tag: $NEW_TAG"
          if [[ "$NEW_TAG" == v* ]]; then
            echo "FAIL: expected new_tag without 'v' prefix, got '$NEW_TAG'"
            exit 1
          fi
          if ! echo "$NEW_TAG" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "FAIL: expected semver format X.Y.Z, got '$NEW_TAG'"
            exit 1
          fi
          echo "PASS: new_tag=$NEW_TAG"
