name: Test default minor bump dry run
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up git origin reachable inside the Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git push "$GITHUB_WORKSPACE/.git-remote" --tags
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - id: action
        uses: .
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BUMP: minor
          WITH_V: "true"
          DRY_RUN: "true"
          INITIAL_VERSION: "0.0.0"
          RELEASE_BRANCHES: act-harness
          BRANCH_HISTORY: last
          VERBOSE: "true"

      - name: Assert new_tag starts with v
        env:
          NEW_TAG: ${{ steps.action.outputs.new_tag }}
        run: |
          echo "new_tag: $NEW_TAG"
          if [[ "$NEW_TAG" != v* ]]; then
            echo "FAIL: expected new_tag to start with 'v', got '$NEW_TAG'"
            exit 1
          fi
          echo "PASS: new_tag=$NEW_TAG starts with v"

      - name: Assert part is minor
        env:
          PART: ${{ steps.action.outputs.part }}
        run: |
          echo "part: $PART"
          if [ "$PART" != "minor" ]; then
            echo "FAIL: expected part='minor', got '$PART'"
            exit 1
          fi
          echo "PASS"
