name: Test major bump via commit message token
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up git with a commit containing #major token
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          # Create a commit with #major in the message
          echo "trigger-major-bump" >> /tmp/trigger-file.txt
          cp /tmp/trigger-file.txt "$GITHUB_WORKSPACE/trigger-major.txt"
          git add "$GITHUB_WORKSPACE/trigger-major.txt"
          git commit -m "feat: breaking change #major"
          # Set up bare remote reachable inside Docker container
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - id: action
        uses: .
        env:
          DEFAULT_BUMP: minor
          DRY_RUN: "true"
          INITIAL_VERSION: "1.0.0"
          RELEASE_BRANCHES: act-harness,master,main
          BRANCH_HISTORY: last
          GITHUB_TOKEN: ${{ github.token }}

      - name: Assert part is major
        env:
          PART: ${{ steps.action.outputs.part }}
          NEW_TAG: ${{ steps.action.outputs.new_tag }}
        run: |
          echo "part: $PART"
          echo "new_tag: $NEW_TAG"
          if [ "$PART" != "major" ]; then
            echo "FAIL: expected part=major (from #major token in commit), got '$PART'"
            exit 1
          fi
          echo "PASS: part=major"

      - name: Assert new_tag has bumped major version
        env:
          NEW_TAG: ${{ steps.action.outputs.new_tag }}
        run: |
          echo "new_tag: $NEW_TAG"
          if [ -z "$NEW_TAG" ]; then
            echo "FAIL: new_tag is empty"
            exit 1
          fi
          # With initial 1.0.0 and major bump, expect 2.0.0
          if ! echo "$NEW_TAG" | grep -qE '^[2-9]\.[0-9]+\.[0-9]+$'; then
            echo "FAIL: expected major version >= 2, got '$NEW_TAG'"
            exit 1
          fi
          echo "PASS: major version bumped correctly to $NEW_TAG"
